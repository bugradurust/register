<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Pano</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pano" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="screen">
      <header id="ticker" class="ticker" hidden>
        <div id="market" class="market"></div>
        <button id="net" class="net" type="button" hidden></button>
      </header>

      <main id="app">
        <section class="card clock">
          <div class="time">
            <span id="hh">--</span><span id="colon" class="colon">:</span><span id="mm">--</span
            ><span id="ss" class="secs">--</span>
          </div>
          <div class="dateline"><span id="weekday" class="weekday"></span> <span id="date"></span></div>
          <div id="sun" class="sun"></div>
        </section>

        <section class="card now" id="now">
          <div class="placeholder">Hava durumu yükleniyor…</div>
        </section>

        <section class="card forecast" id="forecast"></section>

        <section class="card news" id="newsCard">
          <header class="news-head">
            <nav id="chips" class="chips"></nav>
            <span id="dots" class="dots"></span>
            <span id="status" class="status"></span>
          </header>
          <div id="news" class="news-list">
            <div class="placeholder">Haberler yükleniyor…</div>
          </div>
        </section>
      </main>
    </div>

    <button id="fs" class="corner fs" hidden aria-label="Tam ekran">⛶</button>
    <button id="gear" class="corner gear" aria-label="Ayarlar">⚙︎</button>
    <div id="panel" class="panel" hidden>
      <div id="panelCard" class="panel-card"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
